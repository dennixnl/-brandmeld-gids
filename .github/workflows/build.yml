- name: Android project aanmaken
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "nl.brandmeldgids.app",
            "appName": "Brandmeld Gids",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android
