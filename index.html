<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brandmeld Gids</title>
  <style>
    /* ===================== RESET & BASE ===================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --red: #dc2626;
      --red-dark: #b91c1c;
      --red-light: #fef2f2;
      --red-border: #fecaca;
      --amber: #d97706;
      --amber-light: #fffbeb;
      --amber-border: #fde68a;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --white: #ffffff;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,.1);
      --shadow-xl: 0 20px 40px rgba(0,0,0,.12);
      --radius-sm: 8px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --radius-full: 9999px;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--slate-50);
      color: var(--slate-900);
      min-height: 100vh;
      padding-bottom: 80px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button {
      cursor: pointer;
      border: none;
      background: none;
      font-family: inherit;
      font-size: inherit;
      color: inherit;
    }
    input {
      font-family: inherit;
      font-size: inherit;
    }

    /* ===================== SPLASH ===================== */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: var(--red);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #splash.hidden { opacity: 0; visibility: hidden; }
    #splash .splash-icon {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0,0,0,.2);
      animation: splashPop 0.5s cubic-bezier(.34,1.56,.64,1) both;
    }
    #splash h1 {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.05em;
      animation: splashUp 0.5s 0.2s ease both;
    }
    #splash p {
      margin-top: 8px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      opacity: 0.8;
      animation: splashUp 0.5s 0.4s ease both;
    }
    @keyframes splashPop { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes splashUp  { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    /* ===================== HEADER ===================== */
    header {
      background: var(--white);
      border-bottom: 1px solid var(--slate-200);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .header-inner {
      max-width: 896px;
      margin: 0 auto;
      padding: 0 16px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-btn {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo-icon {
      background: var(--red);
      padding: 6px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }
    .logo-btn:hover .logo-icon { background: var(--red-dark); }
    .logo-btn h1 { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; }
    .icon-btn {
      width: 40px; height: 40px;
      border-radius: var(--radius-full);
      display: flex; align-items: center; justify-content: center;
      color: var(--slate-500);
      transition: background 0.15s;
    }
    .icon-btn:hover { background: var(--slate-100); }

    /* ===================== MAIN ===================== */
    main {
      max-width: 896px;
      margin: 0 auto;
      padding: 32px 16px;
    }

    /* ===================== BRAND GRID ===================== */
    .brand-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    @media (min-width: 480px) { .brand-grid { grid-template-columns: repeat(3, 1fr); } }
    .brand-card {
      background: var(--white);
      padding: 32px 16px;
      border-radius: var(--radius-xl);
      border: 1px solid var(--slate-200);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      transition: box-shadow 0.2s, border-color 0.2s, background 0.2s;
      animation: fadeUp 0.35s ease both;
    }
    .brand-card:hover {
      box-shadow: var(--shadow-md);
      border-color: #fca5a5;
      background: #fff5f5;
    }
    .brand-card:hover .brand-icon { background: #fee2e2; }
    .brand-card:hover .brand-icon svg { color: var(--red); }
    .brand-icon {
      width: 52px; height: 52px;
      border-radius: 16px;
      background: var(--slate-100);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .brand-icon svg { color: var(--slate-400); transition: color 0.2s; }
    .brand-name { font-weight: 800; font-size: 1.05rem; color: var(--slate-900); }

    /* ===================== SEARCH ===================== */
    .search-wrap { position: relative; margin-bottom: 32px; }
    .search-wrap svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--slate-400);
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      background: var(--white);
      border: 1.5px solid var(--slate-200);
      border-radius: var(--radius-xl);
      padding: 16px 16px 16px 48px;
      font-size: 1.05rem;
      color: var(--slate-900);
      box-shadow: var(--shadow-sm);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .search-input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 4px rgba(220,38,38,.1);
    }
    .search-input::placeholder { color: var(--slate-400); }

    /* ===================== MANUAL LIST ===================== */
    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .list-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--slate-400);
    }
    .back-btn {
      font-size: 12px;
      font-weight: 700;
      color: var(--red);
      transition: opacity 0.15s;
    }
    .back-btn:hover { opacity: 0.7; text-decoration: underline; }
    .manual-list { display: grid; gap: 10px; }
    .manual-card {
      background: var(--white);
      padding: 20px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--slate-200);
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      transition: box-shadow 0.2s, border-color 0.2s;
      animation: fadeUp 0.3s ease both;
      width: 100%;
    }
    .manual-card:hover { box-shadow: var(--shadow-md); border-color: var(--slate-300); }
    .manual-card-info { display: flex; flex-direction: column; gap: 4px; }
    .manual-tags { display: flex; align-items: center; gap: 8px; }
    .brand-tag {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--red);
      background: var(--red-light);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .model-tag { font-size: 12px; color: var(--slate-500); font-weight: 500; }
    .manual-card h3 { font-size: 1.05rem; font-weight: 600; color: var(--slate-900); }
    .manual-card .chevron { color: var(--slate-300); transition: color 0.15s; flex-shrink: 0; }
    .manual-card:hover .chevron { color: var(--slate-900); }
    .empty-state {
      padding: 48px 16px;
      text-align: center;
      background: var(--white);
      border-radius: var(--radius-xl);
      border: 2px dashed var(--slate-200);
      color: var(--slate-400);
    }

    /* ===================== DETAIL VIEW ===================== */
    .detail-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      border: 1px solid var(--slate-200);
      box-shadow: var(--shadow-xl);
      overflow: hidden;
      animation: fadeUp 0.3s ease;
    }
    .detail-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--slate-100);
      background: var(--slate-50);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .detail-header-center { text-align: center; flex: 1; }
    .detail-brand-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--red);
      display: block;
      margin-bottom: 2px;
    }
    .detail-header h2 { font-size: 1.15rem; font-weight: 800; }
    .print-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--white);
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 700;
      color: var(--slate-600);
      box-shadow: var(--shadow-sm);
      transition: background 0.15s;
      white-space: nowrap;
    }
    .print-btn:hover { background: var(--slate-50); }
    .print-btn svg { color: var(--red); }
    .print-btn-label { display: inline; }
    @media (max-width: 480px) {
      .print-btn { padding: 8px 10px; }
      .print-btn-label { display: none; }
    }
    .detail-body { padding: 32px; }
    .warning-box {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--amber-light);
      border: 1px solid var(--amber-border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 32px;
    }
    .warning-box svg { color: var(--amber); flex-shrink: 0; margin-top: 2px; }
    .warning-box p { font-size: 13px; color: #92400e; line-height: 1.5; }
    .steps-list { display: flex; flex-direction: column; gap: 0; }
    .step-item { display: flex; gap: 16px; margin-bottom: 32px; }
    .step-item:last-child { margin-bottom: 0; }
    .step-left { display: flex; flex-direction: column; align-items: center; }
    .step-num {
      width: 40px; height: 40px;
      border-radius: var(--radius-full);
      background: var(--slate-900);
      color: white;
      font-size: 1rem;
      font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(15,23,42,.25);
    }
    .step-line {
      width: 2px;
      flex: 1;
      background: var(--slate-100);
      margin: 8px 0;
      min-height: 20px;
    }
    .step-right { flex: 1; padding-top: 8px; display: flex; align-items: flex-start; gap: 12px; }
    .step-icon {
      padding: 8px;
      background: var(--slate-100);
      border-radius: 12px;
      color: var(--slate-600);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .step-icon.urgent {
      background: var(--red-light);
      color: var(--red);
    }
    .step-icon.warning {
      background: var(--amber-light);
      color: var(--amber);
    }
    .step-text { font-size: 1.1rem; font-weight: 500; color: var(--slate-800); line-height: 1.55; }
    @media (max-width: 640px) {
      .step-text { font-size: 0.88rem; line-height: 1.5; font-weight: 500; }
      .step-icon { padding: 6px; border-radius: 10px; }
      .step-icon svg { width: 16px; height: 16px; }
      .step-num { width: 30px; height: 30px; font-size: 0.82rem; }
      .step-right { gap: 8px; padding-top: 3px; }
      .step-item { margin-bottom: 16px; gap: 10px; }
      .step-line { min-height: 10px; }
      .detail-body { padding: 14px; }
      .detail-header { padding: 12px 14px; }
      .detail-header h2 { font-size: 0.92rem; }
      .warning-box { padding: 10px; margin-bottom: 14px; }
      .warning-box p { font-size: 11px; }
      .done-btn-wrap { margin-top: 24px; padding-top: 16px; }
      .done-btn { padding: 12px 24px; font-size: 0.88rem; }
    }
    .done-btn-wrap { margin-top: 48px; padding-top: 32px; border-top: 1px solid var(--slate-100); display: flex; justify-content: center; }
    #pdf-drop-zone:hover { border-color: var(--red) !important; background: var(--red-light) !important; }
    .done-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--slate-900);
      color: white;
      padding: 16px 36px;
      border-radius: var(--radius-full);
      font-size: 1rem;
      font-weight: 800;
      box-shadow: 0 8px 24px rgba(15,23,42,.25);
      transition: background 0.15s, transform 0.1s;
    }
    .done-btn:hover { background: var(--slate-800); transform: translateY(-1px); }
    .done-btn:active { transform: translateY(0); }

    /* ===================== ADD FORM ===================== */
    .form-card {
      background: var(--white);
      border-radius: var(--radius-xl);
      border: 1px solid var(--slate-200);
      box-shadow: var(--shadow-xl);
      overflow: hidden;
      animation: fadeUp 0.3s ease;
    }
    .form-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--slate-100);
      display: flex; align-items: center; justify-content: space-between;
    }
    .form-header h2 { font-size: 1.1rem; font-weight: 800; }
    .form-body { padding: 32px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
    @media (max-width: 480px) { .form-grid { grid-template-columns: 1fr; } }
    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .form-group label { font-size: 13px; font-weight: 700; color: var(--slate-700); }
    .form-input {
      width: 100%;
      background: var(--slate-50);
      border: 1.5px solid var(--slate-200);
      border-radius: var(--radius-md);
      padding: 12px;
      font-size: 15px;
      color: var(--slate-900);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(220,38,38,.1);
    }
    .step-field { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
    .step-num-sm {
      width: 36px; height: 36px;
      border-radius: var(--radius-full);
      background: var(--slate-100);
      color: var(--slate-400);
      font-size: 13px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .add-step-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      margin-top: 4px;
      padding: 4px;
      transition: opacity 0.15s;
    }
    .add-step-btn:hover { opacity: 0.7; }
    .form-actions { padding-top: 24px; display: flex; flex-direction: column; gap: 12px; }
    .submit-btn {
      width: 100%;
      background: var(--slate-900);
      color: white;
      padding: 16px;
      border-radius: var(--radius-lg);
      font-size: 1rem;
      font-weight: 800;
      transition: background 0.15s;
      box-shadow: 0 4px 16px rgba(15,23,42,.15);
    }
    .submit-btn:hover { background: var(--slate-800); }
    .sys-divider {
      padding-top: 24px;
      margin-top: 8px;
      border-top: 1px solid var(--slate-100);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .sys-label {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--slate-400);
      text-align: center;
    }
    .reset-btn {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--slate-200);
      border-radius: var(--radius-lg);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--slate-400);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.15s;
    }
    .reset-btn:hover { background: var(--red-light); color: var(--red); border-color: var(--red-border); }

    /* ===================== NAV ===================== */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--white);
      border-top: 1px solid var(--slate-200);
      padding: 8px 24px;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      box-shadow: 0 -4px 16px rgba(0,0,0,.06);
    }
    @media (max-width: 640px) { .bottom-nav { display: flex; } body { padding-bottom: 80px; } }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--slate-400);
      padding: 4px 16px;
      border-radius: var(--radius-md);
      transition: color 0.15s;
    }
    .nav-item.active { color: var(--red); }
    .nav-item.hidden-nav { display: none; }
    .add-btn-label { display: inline; }
    @media (max-width: 400px) { .add-btn-label { display: none; } }

    /* ===================== FOOTER ===================== */
    footer {
      max-width: 896px;
      margin: 0 auto;
      padding: 48px 16px;
      text-align: center;
      color: var(--slate-400);
      font-size: 13px;
    }
    footer .divider { border-top: 1px solid var(--slate-100); padding-top: 24px; }

    /* ===================== ANIM ===================== */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .page { animation: fadeUp 0.3s ease; }

    /* ===================== PRINT ===================== */
    @media print {
      .no-print { display: none !important; }
      header, .bottom-nav, footer { display: none !important; }
      body { background: white; padding: 0; }
      main { padding: 0; }
      .detail-card { box-shadow: none; border: none; }
      .done-btn-wrap { display: none; }
      .warning-box { break-inside: avoid; }
      .step-item { break-inside: avoid; }
    }

    /* ===================== OFFLINE BANNER ===================== */
    #offline-banner {
      background: #d97706;
      color: white;
      font-size: 10px;
      font-weight: 800;
      text-align: center;
      padding: 4px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      display: none;
    }
    #offline-banner.show { display: block; }
  </style>
</head>
<body>

<!-- Splash Screen -->
<div id="splash">
  <div class="splash-icon">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
  </div>
  <h1>BRANDMELD GIDS</h1>
  <p>🛡 Professionele Assistent &bull; Offline Beschikbaar</p>
</div>

<!-- Offline Banner -->
<div id="offline-banner">Offline Modus — Gegevens worden lokaal opgeslagen</div>

<!-- Header -->
<header class="no-print">
  <div class="header-inner">
    <button class="logo-btn" onclick="goHome()">
      <div class="logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1>Brandmeld Gids</h1>
    </button>
    <div style="display:flex;align-items:center;gap:8px;">

      <button class="icon-btn" id="header-settings-btn" onclick="onSettingsClick()" title="Beheerder inloggen">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<main id="main-content">
  <!-- Content injected by JS -->
</main>

const FB_PROJECT = "brandmeld-gids";
const FB_API_KEY = "AIzaSyBxGYQLNPr4FvuRQeHIMnRkf31Z01tim8k";
const FB_BASE    = `https://firestore.googleapis.com/v1/projects/${FB_PROJECT}/databases/(default)/documents`;

// Hulpfuncties voor Firestore REST
function toFirestoreValue(val) {
  if (val === null || val === undefined) return { nullValue: null };
  if (typeof val === 'string')  return { stringValue: val };
  if (typeof val === 'number')  return { integerValue: String(val) };
  if (typeof val === 'boolean') return { booleanValue: val };
  if (Array.isArray(val))       return { arrayValue: { values: val.map(toFirestoreValue) } };
  if (typeof val === 'object')  return { mapValue: { fields: Object.fromEntries(Object.entries(val).map(([k,v]) => [k, toFirestoreValue(v)])) } };
  return { stringValue: String(val) };
}

function fromFirestoreValue(val) {
  if (!val) return null;
  if ('stringValue'  in val) return val.stringValue;
  if ('integerValue' in val) return Number(val.integerValue);
  if ('doubleValue'  in val) return Number(val.doubleValue);
  if ('booleanValue' in val) return val.booleanValue;
  if ('nullValue'    in val) return null;
  if ('arrayValue'   in val) return (val.arrayValue.values || []).map(fromFirestoreValue);
  if ('mapValue'     in val) return Object.fromEntries(Object.entries(val.mapValue.fields || {}).map(([k,v]) => [k, fromFirestoreValue(v)]));
  return null;
}

function docToObject(doc) {
  if (!doc.fields) return null;
  return Object.fromEntries(Object.entries(doc.fields).map(([k,v]) => [k, fromFirestoreValue(v)]));
}

async function fbGet(collection) {
  const url = `${FB_BASE}/${collection}?key=${FB_API_KEY}&pageSize=200`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Firestore GET mislukt: ' + res.status);
  const data = await res.json();
  return (data.documents || []).map(doc => docToObject(doc)).filter(Boolean);
}

async function fbSet(collection, docId, obj) {
  const fields = Object.fromEntries(Object.entries(obj).map(([k,v]) => [k, toFirestoreValue(v)]));
  const url = `${FB_BASE}/${collection}/${docId}?key=${FB_API_KEY}`;
  const res = await fetch(url, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ fields })
  });
  if (!res.ok) throw new Error('Firestore SET mislukt: ' + res.status);
  return res.json();
}

async function fbDelete(collection, docId) {
  const url = `${FB_BASE}/${collection}/${docId}?key=${FB_API_KEY}`;
  const res = await fetch(url, { method: 'DELETE' });
  if (!res.ok) throw new Error('Firestore DELETE mislukt: ' + res.status);
}

// ===================== FIREBASE STORAGE =====================
let firebaseIsEmpty = false;

async function loadFromFirestore() {
  try {
    const docs = await fbGet('manuals');
    if (docs.length > 0) {
      manuals = docs.sort((a,b) => (a.sortOrder||a.id) - (b.sortOrder||b.id));
      firebaseIsEmpty = false;
    } else {
      // Firestore leeg — gebruik lokale data als fallback
      manuals = [...INITIAL_MANUALS];
      firebaseIsEmpty = true;
    }
    // Bouw BRANDS dynamisch op uit de geladen handleidingen
    const brandOrder = ["Penta","Siemens","Notifier","Esser D5000","Esser D7000","Bosch","Autronica"];
    const foundBrands = [...new Set(manuals.map(m => m.brand))];
    // Bekende merken in vaste volgorde, daarna nieuwe merken op alfabetische volgorde
    BRANDS = [
      ...brandOrder.filter(b => foundBrands.includes(b)),
      ...foundBrands.filter(b => !brandOrder.includes(b)).sort()
    ];
  } catch(e) {
    // Offline fallback
    manuals = [...INITIAL_MANUALS];
    firebaseIsEmpty = false;
  }
  isLoading = false;
  render();
  setTimeout(() => document.getElementById('splash')?.classList.add('hidden'), 1200);
}

async function saveToFirestore(manual) {
  try {
    const docId = String(manual.id);
    await fbSet('manuals', docId, { ...manual, sortOrder: manual.id });
    showToast('Handleiding opgeslagen ✓');
  } catch(e) {
    alert('Opslaan mislukt. Controleer je internetverbinding.');
  }
}

async function deleteFromFirestore(id) {
  try {
    await fbDelete('manuals', String(id));
    manuals = manuals.filter(m => m.id !== id);
    showToast('Handleiding verwijderd');
    render();
  } catch(e) {
    alert('Verwijderen mislukt.');
  }
}

async function seedFirestore() {
  if (!confirm(`Database vullen met ${INITIAL_MANUALS.length} standaard handleidingen?

Dit overschrijft de huidige database.`)) return;
  try {
    showToast('Bezig met uploaden...');
    for (const m of INITIAL_MANUALS) {
      await fbSet('manuals', String(m.id), { ...m, sortOrder: m.id });
    }
    manuals = [...INITIAL_MANUALS];
    render();
    showToast(`${INITIAL_MANUALS.length} handleidingen geüpload ✓`);
  } catch(e) {
    alert('Upload mislukt: ' + e.message);
  }
}

    "Centrale resetten",
    "Toegangsniveau vrijgeven",
    "Melder buiten dienst stellen",
    "Handmelder buiten dienst stellen",
    "Zone / groep buiten dienst stellen",
    "Uitgang / sturing buiten dienst stellen",
    "Doormelding brandweer uitschakelen",
    "Sirenes / signaalgevers uitschakelen",
    "Buiten dienst onderdeel herinschakelen",
    "Actieve meldingen bekijken",
    "LED-betekenis en display uitleg",
    "Logboek uitlezen"
  ];

  const prompt = `Je bent een brandmeldinstallatie expert. Analyseer deze handleiding van de ${brand} ${model} brandmeldcentrale.

Genereer voor ELKE van de volgende 14 procedures exacte stap-voor-stap instructies gebaseerd op de handleiding:
${PROCEDURES.map((p,i) => `${i+1}. ${p}`).join('\n')}

BELANGRIJK:
- Gebruik alleen informatie uit de handleiding
- Elke stap moet concreet en uitvoerbaar zijn (max 2 zinnen per stap)
- Gebruik de exacte namen van knoppen/menu's zoals in de handleiding
- Elke procedure heeft minimaal 4 en maximaal 8 stappen

Antwoord ALLEEN met geldig JSON in dit exacte formaat:
{
  "procedures": [
    {
      "action": "Brandalarm afhandelen",
      "steps": [
        {"text": "Stap 1 beschrijving", "icon": "alert-circle"},
        {"text": "Stap 2 beschrijving", "icon": "check-square"}
      ]
    }
  ]
}

Gebruik deze iconen: alert-circle, check-square, volume-x, refresh-cw, lock, menu, search, layers, bell-off, settings, hash, toggle-left, alert-triangle, check, x-circle, external-link, chevron-right, circle-off`;

  try {
    setProgress(25, 'AI leest de handleiding...');

    const apiKey = localStorage.getItem('anthropic_api_key') || '';
    if (!apiKey) {
      alert('Voer eerst je Anthropic API sleutel in (klik op 🔑 API sleutel in de beheerder balk).');
      document.getElementById('analyze-btn').disabled = false;
      document.getElementById('analyze-btn-text').textContent = '🤖 Analyseer PDF & Maak Handleidingen';
      document.getElementById('ai-progress').style.display = 'none';
      return;
    }

    const PROXY_URL = 'https://brandmeld-proxy.tilburgdennis.workers.dev/';
    const response = await fetch(PROXY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        apiKey: apiKey,
        model: 'claude-sonnet-4-20250514',
        max_tokens: 8000,
        messages: [{
          role: 'user',
          content: [
            {
              type: 'document',
              source: { type: 'base64', media_type: 'application/pdf', data: pdfBase64 }
            },
            { type: 'text', text: prompt }
          ]
        }]
      })
    });

    setProgress(70, 'AI verwerkt de procedures...');

    const data = await response.json();

    // Debug: toon wat de proxy teruggeeft als er een fout is
    if (!response.ok || data.error) {
      throw new Error(data.error?.message || JSON.stringify(data).substring(0, 200));
    }

    if (!data.content) {
      throw new Error('Onverwacht antwoord van AI: ' + JSON.stringify(data).substring(0, 200));
    }

    const rawText = data.content.find(b => b.type === 'text')?.text || '';

    setProgress(85, 'Handleidingen samenstellen...');

    // Parse JSON uit response
    const jsonMatch = rawText.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('AI gaf geen geldig JSON terug.');
    const parsed = JSON.parse(jsonMatch[0]);

    const baseId = Date.now();
    generatedManuals = parsed.procedures.map((proc, i) => ({
      id: baseId + i,
      brand: brand,
      model: model,
      action: proc.action,
      steps: proc.steps,
      sortOrder: baseId + i
    }));

    setProgress(100, `${generatedManuals.length} handleidingen gegenereerd!`);

    // Toon preview
    document.getElementById('preview-title').textContent =
      `✅ ${generatedManuals.length} handleidingen klaar voor ${brand} ${model}`;

    const previewList = document.getElementById('preview-list');
    previewList.innerHTML = generatedManuals.map(m => `
      <div style="background:white;border:1px solid var(--slate-200);border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;">
        <div>
          <div style="font-weight:700;font-size:13px;color:var(--slate-800);">${m.action}</div>
          <div style="font-size:11px;color:var(--slate-400);margin-top:2px;">${m.steps.length} stappen</div>
        </div>
        <div style="font-size:11px;color:#16a34a;font-weight:700;">✓</div>
      </div>`).join('');

    document.getElementById('ai-preview').style.display = 'block';

  } catch(e) {
    setProgress(0, '');
    document.getElementById('ai-progress').style.display = 'none';
    alert('Analyse mislukt: ' + e.message);
  }

  document.getElementById('analyze-btn').disabled = false;
  document.getElementById('analyze-btn-text').textContent = '🤖 Analyseer PDF & Maak Handleidingen';
}

async function saveGeneratedManuals() {
  if (!generatedManuals.length) return;
  const btn = event.target;
  btn.textContent = '⏳ Opslaan...';
  btn.disabled = true;

  try {
    for (const m of generatedManuals) {
      await fbSet('manuals', String(m.id), m);
      manuals.push(m);
    }
    // BRANDS wordt automatisch bijgewerkt via loadFromFirestore
    // na het opslaan refreshen we de manuals lijst
    const brand = generatedManuals[0].brand;

    showToast(`${generatedManuals.length} handleidingen opgeslagen ✓`);
    generatedManuals = [];
    pdfBase64 = null;
    isAdding = false;
    selectedBrand = brand;
    render();
  } catch(e) {
    alert('Opslaan mislukt: ' + e.message);
    btn.textContent = '✅ Opslaan in Firebase';
    btn.disabled = false;
  }
}

async function submitForm() {
  // Wordt niet meer gebruikt - vervangen door analyzePDF()
}

async function deleteManual(id) {
  const manual = manuals.find(m => String(m.id) === String(id));
  if (!manual) return;
  if (!confirm(`Weet je zeker dat je "${manual.action}" wilt verwijderen?`)) return;
  selectedManual = null;
  await deleteFromFirestore(id);
}

// ===================== HEADER SETTINGS KNOP =====================
function onSettingsClick() {
  if (isAdmin) adminLogout();
  else showAdminLogin();
}



// ===================== KEYBOARD SHORTCUTS =====================
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'k')) {
    e.preventDefault();
    const inp = document.querySelector('.search-input');
    if (inp) inp.focus();
    else { if (selectedManual || isAdding) { goHome(); setTimeout(() => document.querySelector('.search-input')?.focus(), 50); } }
  }
  if (e.key === 'Escape') {
    if (isAdding) closeAddForm();
    else if (selectedManual) closeDetail();
    else if (selectedBrand) clearBrand();
  }
});

// ===================== OFFLINE =====================
function updateOfflineBanner() {
  const banner = document.getElementById('offline-banner');
  banner.classList.toggle('show', !navigator.onLine);
}
window.addEventListener('online', updateOfflineBanner);
window.addEventListener('offline', updateOfflineBanner);
updateOfflineBanner();

// ===================== INIT =====================
document.getElementById('year').textContent = new Date().getFullYear();
loadFromFirestore();
</script>
